# ==========================================================
#             SpeedBuilders  -  Construcciones
# ==========================================================
# Cada construcción ocupa una base de 5x5 bloques.
#
#  nombre:     nombre que ven los jugadores
#  dificultad: FACIL, MEDIO o DIFICIL
#              (rondas 1-3 fáciles, 4-7 medias y 8-10 difíciles)
#  paleta:     un carácter por bloque, usando block data de Minecraft
#  capas:      de abajo hacia arriba. Cada capa tiene 5 filas de
#              5 caracteres; la primera fila es el lado NORTE, el primer
#              carácter es el lado OESTE y "." es aire.
#
# Solo se exigen las propiedades que escribas entre [ ]:
# "oak_stairs[facing=north]" exige la orientación, "oak_fence" no.
# Las hojas deben llevar [persistent=true] para no desaparecer.
#
# También puedes construir en el juego y guardarlo con:
#   /sb guardar <id> <facil|medio|dificil> <nombre>

construcciones:

  # ------------------------- FÁCILES -------------------------

  piramide:
    nombre: "Pirámide"
    dificultad: FACIL
