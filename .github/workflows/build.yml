name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SpeedBuilders
          path: build/libs/*.jar
      # Publica el .jar como descarga directa en la sección Releases del repositorio.
      - name: Publicar descarga
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima-version
          name: SpeedBuilders (última versión)
          body: "Compilado automáticamente desde el commit ${{ github.sha }} (rama ${{ github.ref_name }})."
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          files: build/libs/*.jar
